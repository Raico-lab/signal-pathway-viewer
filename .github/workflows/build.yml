# GitHub にプッシュすると Windows 版と Mac 版のインストーラーを自動でビルドする（Actions の成果物からダウンロード）
#   Windows: PathwaysViewer-<版>-windows-setup.exe（Inno Setup）
#   Mac:     PathwaysViewer-<版>-mac.dmg
# v1.0.0 のようなタグをプッシュすると、その版で GitHub の Releases にも載せる。
# 配布は Google Drive（25wm2519@student.gs.chiba-u.jp の「PathwaysViewer 配布」フォルダ）で行う。
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"; fi
          echo "PATHWAYS_VERSION=$v" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm PathwaysViewer.spec
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:PATHWAYS_VERSION" installer\windows\PathwaysViewer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer (Mac)
        if: runner.os == 'macOS'
        run: ./installer/mac/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PathwaysViewer-${{ runner.os }}
          path: |
            dist/*-windows-setup.exe
            dist/*-mac.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-windows-setup.exe
            dist/*-mac.dmg
